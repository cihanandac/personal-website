# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: cihanandac/personal-website
  branch: main
  # OAuth broker: sveltia-cms-auth running on Cloudflare Workers. Without this,
  # `oauth` would fall back to Netlify (the schema default for base_url).
  base_url: https://sveltia-cms-auth.cihanandac.workers.dev
  # `token` is kept as a fallback so a Worker outage can't lock you out of
  # publishing — you can still sign in with a personal access token.
  auth_methods:
    - oauth
    - token

site_url: https://cihanandac.com
# Saving commits straight to `main`, which deploys. Sveltia accepts
# `editorial_workflow` in this field but does not implement it yet — it silently
# behaves like `simple`. Upstream plans to add it before the 1.0 release:
# https://sveltiacms.app/en/docs/workflows/editorial
publish_mode: simple

# Fallback for anything outside a collection that sets its own media paths.
media_folder: src/assets
public_folder: /src/assets

collections:
  - name: blog
    label: Blog
    label_singular: Post
    description: Posts published at /blog.
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    preview_path: blog/{{slug}}
    sortable_fields: [pubDate, title]
    # Relative to the entry file (src/content/blog/*.md), so uploads land in
    # src/assets/blog and the frontmatter path stays resolvable by Astro's
    # content-collection image() helper.
    media_folder: '../../assets/blog'
    public_folder: '../../assets/blog'
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
        hint: Used for the page meta description, the RSS feed, and link previews.
      - label: Publish date
        name: pubDate
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
      - label: Updated date
        name: updatedDate
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        required: false
      - label: Hero image
        name: heroImage
        widget: image
        required: false
      - label: Body
        name: body
        widget: markdown
